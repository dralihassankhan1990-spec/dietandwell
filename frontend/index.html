<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ══ PRIMARY SEO META ══════════════════════════════════ -->
    <title>DietAndWell — Evidence-Based Nutrition Coaching & Health Tools</title>
    <meta name="description" content="Get personalised nutrition coaching from a certified nutritionist with 10+ years of clinical experience. Free BMI, TDEE & macro calculators. Evidence-based meal plans for weight loss, performance & gut health." />
    <meta name="keywords" content="nutrition coaching, dietitian, meal planning, BMI calculator, TDEE calculator, macro calculator, weight loss, gut health, sports nutrition, Pakistan nutritionist" />
    <meta name="author" content="DietAndWell" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.dietandwell.com/" />

    <!-- ══ OPEN GRAPH (Facebook / LinkedIn / WhatsApp) ════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.dietandwell.com/" />
    <meta property="og:title"       content="DietAndWell — Evidence-Based Nutrition Coaching" />
    <meta property="og:description" content="Personalised nutrition coaching backed by 10+ years of clinical practice. Free health calculators, meal plans, and science-based blog articles." />
    <meta property="og:image"       content="https://www.dietandwell.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="DietAndWell" />
    <meta property="og:locale"      content="en_US" />

    <!-- ══ TWITTER CARD ══════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@dietandwell" />
    <meta name="twitter:title"       content="DietAndWell — Evidence-Based Nutrition Coaching" />
    <meta name="twitter:description" content="Personalised nutrition coaching backed by 10+ years of clinical practice." />
    <meta name="twitter:image"       content="https://www.dietandwell.com/og-image.jpg" />

    <!-- ══ STRUCTURED DATA — Organisation ════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DietAndWell",
      "url": "https://www.dietandwell.com",
      "logo": "https://www.dietandwell.com/logo.png",
      "description": "Evidence-based nutrition coaching and health tools",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+92-339-4056390",
        "contactType": "customer support",
        "email": "contact@dietandwell.com"
      },
      "sameAs": [
        "https://www.facebook.com/dietandwell",
        "https://www.instagram.com/dietandwell"
      ]
    }
    </script>

    <!-- ══ STRUCTURED DATA — WebSite with SearchAction ═══════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DietAndWell",
      "url": "https://www.dietandwell.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.dietandwell.com/blog?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ══ PERFORMANCE ════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- ══ FAVICON ════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A6640" />

    <!-- ══ SECURITY HEADERS (set via _headers file in Vercel too) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
